<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b2f44; }
      body { display: flex; align-items: center; justify-content: center; }
      /* Sempre 5:4 (600x480 no itch), o maior possível dentro da janela. */
      #wrap { position: relative; width: min(100vw, 125vh); height: min(80vw, 100vh); }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #9ddcf2; outline: none; }
      #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                 font-family: "Trebuchet MS", sans-serif; color: #fff1c9; text-shadow: 0 2px 0 #3b2412; }
      #loading h1 { margin: 0 0 14px; font-size: 32px; }
      #bar { width: 60%; height: 16px; border: 3px solid #5c3417; border-radius: 10px; background: rgba(30, 20, 10, 0.6); overflow: hidden; }
      #fill { width: 0%; height: 100%; background: #2ec4b6; }
      #loading p { margin: 10px 0 0; font-size: 14px; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
      <div id="loading">
        <h1>{{{ PRODUCT_NAME }}}</h1>
        <div id="bar"><div id="fill"></div></div>
        <p>Carregando...</p>
      </div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var fill = document.querySelector("#fill");

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      }, function (progress) {
        fill.style.width = (100 * progress) + "%";
      }).then(function () {
        loading.remove();
        canvas.focus();
      }).catch(function (message) {
        alert(message);
      });
    </script>
  </body>
</html>
